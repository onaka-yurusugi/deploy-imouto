name: 妹を成長させる

on:
  schedule:
    # 20分おき = 1日72回。無料プランの「1日100ビルド」に手動デプロイぶんの余裕を残す
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/tick.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAILBOX_BRANCH: mailbox
